name: Deploy to Google Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Syntax Check
        run: npm run check

      - name: Run Tests
        run: npm test

  deploy:
    name: Deploy Cloud Run & Firebase Hosting
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Cloud Authentication
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy daybook \
            --source . \
            --region europe-southwest1 \
            --service-account daybook-run@daybook-ma.iam.gserviceaccount.com \
            --build-service-account=projects/daybook-ma/serviceAccounts/github-deployer@daybook-ma.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --min-instances 0 \
            --set-env-vars "DAYBOOK_BASE_URL=https://dental-monitoring-dashboard.web.app,\
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},\
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }},\
          DAYBOOK_ENCRYPTION_KEY=${{ secrets.DAYBOOK_ENCRYPTION_KEY }},\
          DAYBOOK_SCHEDULER_SECRET=${{ secrets.DAYBOOK_SCHEDULER_SECRET }}"

      - name: Deploy Firebase Hosting
        continue-on-error: true
        run: |
          npx -y firebase-tools@latest deploy --only hosting --project daybook-ma
